name: Build images

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - ".github/workflows/images.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions: {}

env:
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
  DOCKLE_IMAGE: goodwithtech/dockle:v0.4.15@sha256:eade932f793742de0aa8755406c7677cd7696f8675b6180926f7eeffa7abe6b9

jobs:
  lint:
    name: Lint ${{ matrix.service }} Dockerfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Run Hadolint
        run: |
          docker run --rm -i "${HADOLINT_IMAGE}" hadolint --failure-threshold warning - \
            < "apps/${{ matrix.service }}/Dockerfile"

  build:
    name: Build ${{ matrix.service }} for ${{ matrix.target.arch }}
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]
        target:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: Set image name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/lab404-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - id: build
        name: Build and push by digest
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/${{ matrix.service }}
          platforms: ${{ matrix.target.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.service }}-${{ matrix.target.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  trivy:
    name: Trivy ${{ matrix.service }} for ${{ matrix.arch }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]
        arch: [amd64, arm64]

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests-${{ matrix.service }}-${{ matrix.arch }}
          path: /tmp/digests

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull exact platform digest
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          digest="$(ls /tmp/digests)"
          ref="ghcr.io/${OWNER,,}/lab404-${{ matrix.service }}@sha256:${digest}"
          docker pull --platform "linux/${{ matrix.arch }}" "${ref}"
          mkdir -p work evidence
          docker save --output work/image.tar "${ref}"

      - name: Scan, write SBOM and reports
        run: |
          trivy() {
            docker run --rm -v trivy-cache:/root/.cache \
              -v "$PWD/work:/work:ro" -v "$PWD/evidence:/evidence" \
              "${TRIVY_IMAGE}" image --quiet --input /work/image.tar "$@"
          }
          trivy --format cyclonedx --output /evidence/sbom.cdx.json
          trivy --scanners vuln --format table --output /evidence/trivy.txt
          trivy --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.service }}-${{ matrix.arch }}
          path: evidence/
          retention-days: 1

  dockle:
    name: Dockle ${{ matrix.service }} for ${{ matrix.arch }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]
        arch: [amd64, arm64]

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests-${{ matrix.service }}-${{ matrix.arch }}
          path: /tmp/digests

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull exact platform digest
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          digest="$(ls /tmp/digests)"
          ref="ghcr.io/${OWNER,,}/lab404-${{ matrix.service }}@sha256:${digest}"
          docker pull --platform "linux/${{ matrix.arch }}" "${ref}"
          mkdir -p work evidence
          docker save --output work/image.tar "${ref}"

      # Kubernetes probes handle health checks, and --access-logfile is a
      # gunicorn flag that Dockle mistakes for a credential.
      - name: Run Dockle
        run: |
          docker run --rm -v "$PWD/work:/work:ro" -v "$PWD/evidence:/evidence" \
            "${DOCKLE_IMAGE}" \
            --exit-code 1 --exit-level warn \
            --ignore CIS-DI-0006 \
            --accept-key=--access-logfile \
            --format json --output /evidence/dockle.json \
            --input /work/image.tar

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dockle-${{ matrix.service }}-${{ matrix.arch }}
          path: evidence/
          retention-days: 1

  publish:
    name: Publish ${{ matrix.service }} index
    needs: [trivy, dockle]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        service: [web, votes]

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.service }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform index
        working-directory: /tmp/digests
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MOVE_LATEST: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          image="ghcr.io/${OWNER,,}/lab404-${{ matrix.service }}"
          tags=(--tag "${image}:sha-${SHA}")
          if [ "${MOVE_LATEST}" = "true" ]; then
            tags+=(--tag "${image}:latest")
          fi
          sources=()
          for digest in *; do
            sources+=("${image}@sha256:${digest}")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          mkdir -p /tmp/evidence
          docker buildx imagetools inspect "${image}:sha-${SHA}" | tee /tmp/evidence/index.txt

      - name: Upload index evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: index-${{ matrix.service }}
          path: /tmp/evidence/
          retention-days: 1

  evidence:
    name: Upload security evidence
    needs: publish
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{trivy,dockle,index}-*"
          path: evidence

      - name: Upload evidence bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
