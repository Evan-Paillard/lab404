apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-image-signatures
spec:
  failurePolicy: Fail
  validationActions:
    - Deny
  webhookConfiguration:
    timeoutSeconds: 15
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: lab404
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  matchImageReferences:
    - glob: ghcr.io/evan-paillard/lab404-web*
    - glob: ghcr.io/evan-paillard/lab404-votes*
  validationConfigurations:
    mutateDigest: false
    verifyDigest: true
    required: true
  attestors:
    - name: github
      cosign:
        keyless:
          identities:
            - subject: https://github.com/Evan-Paillard/lab404/.github/workflows/images.yml@refs/heads/feat/stage02
              issuer: https://token.actions.githubusercontent.com
        ctlog:
          url: https://rekor.sigstore.dev
  validations:
    - expression: >-
        (images.containers + images.initContainers + images.ephemeralContainers)
        .all(image, verifyImageSignatures(image, [attestors.github]) > 0)
      message: Application images must be signed by the lab404 GitHub Actions workflow.
