driver:
  kind: modern_ebpf
  modernEbpf:
    leastPrivileged: true

falco:
  json_output: true
  watch_config_files: false

falcoctl:
  artifact:
    follow:
      enabled: false
  config:
    artifact:
      install:
        refs: [falco-rules:5.2.0]

tolerations:
  - key: node-role.kubernetes.io/master
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    effect: NoSchedule
  - key: workload
    operator: Equal
    value: stateful
    effect: NoSchedule
